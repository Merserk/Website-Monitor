<!doctype html>
<html>

<head>
  <meta charset="utf-8" />
  <title>Monitor Dashboard</title>
  <link rel="stylesheet" href="../styles/dashboard.css" />
</head>

<body>
  <main class="container">
    <div class="dashboard-header">
      <div class="header-title">
        <img src="../icons/icon128.png" alt="Logo" class="header-logo" />
        <h2>Website Monitor Dashboard</h2>
      </div>
      <div class="header-controls">
        <section class="add-monitor">
          <div class="add-monitor-reveal">
            <input id="url" placeholder="https://example.com" />
          </div>
          <button id="selectBtn" title="Select Element to Monitor">
            <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2.5" fill="none"
              stroke-linecap="round" stroke-linejoin="round">
              <line x1="12" y1="5" x2="12" y2="19"></line>
              <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
          </button>
        </section>
        <button id="toggleAllBtn" title="Start/Stop Monitoring">
          <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2.5" fill="none"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M5 22h14"></path>
            <path d="M5 2h14"></path>
            <path d="M17 22v-4.172a2 2 0 0 0-.586-1.414L12 12l-4.414 4.414A2 2 0 0 0 7 17.828V22"></path>
            <path d="M7 2v4.172a2 2 0 0 0 .586 1.414L12 12l4.414-4.414A2 2 0 0 0 17 6.172V2"></path>
          </svg>
        </button>
        <button id="checkAllBtn" title="Check All Now">
          <span id="checkIconPlay">
            <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2.5" fill="none"
              stroke-linecap="round" stroke-linejoin="round">
              <polygon points="5 3 19 12 5 21 5 3"></polygon>
            </svg>
          </span>
          <span id="checkIconStop" style="display: none;">
            <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2.5" fill="none"
              stroke-linecap="round" stroke-linejoin="round">
              <rect x="6" y="6" width="12" height="12"></rect>
            </svg>
          </span>
        </button>
      </div>
    </div>

    <div id="dashboardView">

      <section class="list">
        <div class="list-header">
          <div class="tabs">
            <button class="tab-btn active" data-view="active">Active Monitors</button>
            <button class="tab-btn" data-view="bin">Recycle Bin</button>
          </div>
          <div class="header-right">
            <button id="emptyBinBtn" class="small danger" style="display:none;">Empty Recycle Bin</button>
            <span id="global-countdown" class="global-countdown-text"></span>
          </div>
        </div>
        <div id="monitors"></div>
      </section>
    </div>

    <div id="settingsView" style="display: none;">
      <div class="settings-header">
        <button id="backToDashboardBtn" class="text-btn">&larr; Back to Dashboard</button>
        <h3>Global Settings</h3>
        <div class="stats-container-inline">Total checks: <span id="totalCheckCount">0</span></div>
      </div>

      <section class="global-setting-item">
        <div class="setting-item-layout">
          <label for="globalInterval">Global Check Interval (minutes)</label>
          <div class="number-input-wrapper">
            <button class="spin-btn" data-action="decrease" data-target="globalInterval">-</button>
            <input id="globalInterval" type="number" min="1" value="60" />
            <button class="spin-btn" data-action="increase" data-target="globalInterval">+</button>
          </div>
        </div>
      </section>

      <section class="global-setting-item">
        <div class="setting-item-layout">
          <label for="maxConcurrency">Max concurrent checks</label>
          <div class="number-input-wrapper">
            <button class="spin-btn" data-action="decrease" data-target="maxConcurrency">-</button>
            <input id="maxConcurrency" type="number" min="1" value="1" />
            <button class="spin-btn" data-action="increase" data-target="maxConcurrency">+</button>
          </div>
        </div>
      </section>

      <section class="global-setting-item">
        <div class="setting-item-layout">
          <label>Batch Actions</label>
          <button id="moveAllToBinBtn" class="danger-btn">Move all Active Monitors to Recycle Bin</button>
        </div>
      </section>

      <section class="import-export-controls">
        <h3>Import / Export Data</h3>
        <div class="actions">
          <button id="importBtn">Import Monitors</button>
          <button id="exportBtn">Export Monitors</button>
          <input type="file" id="importFile" accept=".json" style="display: none;" />
        </div>
      </section>
    </div>
  </main>

  <button id="settingsToggleBtn" class="floating-icon-btn" title="Settings">
    <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none"
      stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="3"></circle>
      <path
        d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z">
      </path>
    </svg>
  </button>
  <script src="../js/storage.js"></script>
  <script src="../js/export_import.js"></script>
  <script src="../js/dashboard.js"></script>
</body>

</html>
